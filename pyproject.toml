[project]
name = "codeintel"
version = "0.1.0"
description = "Project-agnostic code-intelligence platform: extract facts from codebases into a unified Kuzu graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
    "kuzu>=0.11",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.25",
]

[project.scripts]
codeintel = "codeintel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeintel"]
